[project]
name = "agentic-job-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "black>=26.5.1",
    "isort>=8.0.1",
    "langchain>=1.3.14",
    "langchain-openai>=1.4.1",
    "langchain-tavily>=0.2.18",
    "requests[socks]>=2.34.2",
    "python-dotenv>=1.2.2",
    "tavily>=1.1.0",
    "tavily-python>=0.8.1",
    "httpx[socks]>=0.28.1",
    "pre-commit>=4.1.0",
    "ruff>=0.9.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["job-agent", "main"]
